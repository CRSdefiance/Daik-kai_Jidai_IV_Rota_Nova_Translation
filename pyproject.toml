[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dk4-translation-tool"
version = "0.1.0"
description = "Local Nintendo DS ROM translation research toolchain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ndspy>=4.2.0", "pyxdelta>=0.2.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
dk4tool = "dk4tool.cli:main"

[tool.setuptools.packages.find]
include = ["dk4tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a user-supplied DK4_NDS_ROM"]

[tool.ruff]
line-length = 100
